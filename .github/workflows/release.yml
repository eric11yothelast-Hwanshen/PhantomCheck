name: Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Decode keystore
        env:
          PHANTOM_KEYSTORE_BASE64: ${{ secrets.PHANTOM_KEYSTORE_BASE64 }}
          PHANTOM_KEYSTORE_PASSWORD: ${{ secrets.PHANTOM_KEYSTORE_PASSWORD }}
          PHANTOM_KEY_ALIAS: ${{ secrets.PHANTOM_KEY_ALIAS }}
          PHANTOM_KEY_PASSWORD: ${{ secrets.PHANTOM_KEY_PASSWORD }}
        run: |
          if [ -z "$PHANTOM_KEYSTORE_BASE64" ]; then
            echo "::error::Missing required secret PHANTOM_KEYSTORE_BASE64; refusing to create empty keystore."
            exit 1
          fi
          if [ -z "$PHANTOM_KEYSTORE_PASSWORD" ] || [ -z "$PHANTOM_KEY_ALIAS" ] || [ -z "$PHANTOM_KEY_PASSWORD" ]; then
            echo "::error::Missing required signing secret(s): PHANTOM_KEYSTORE_PASSWORD, PHANTOM_KEY_ALIAS, or PHANTOM_KEY_PASSWORD."
            exit 1
          fi
          printf '%s' "$PHANTOM_KEYSTORE_BASE64" | base64 -d > "$HOME/phantom-release.jks"
          if [ ! -s "$HOME/phantom-release.jks" ]; then
            rm -f "$HOME/phantom-release.jks"
            echo "::error::Decoded keystore is empty (0 bytes)."
            exit 1
          fi

      - name: Build Release APK
        env:
          PHANTOM_KEYSTORE_PASSWORD: ${{ secrets.PHANTOM_KEYSTORE_PASSWORD }}
          PHANTOM_KEY_ALIAS: ${{ secrets.PHANTOM_KEY_ALIAS }}
          PHANTOM_KEY_PASSWORD: ${{ secrets.PHANTOM_KEY_PASSWORD }}
        run: PHANTOM_KEYSTORE_FILE="$HOME/phantom-release.jks" ./gradlew :app:assembleRelease --no-daemon

      - name: Generate Release APK SHA-256
        run: |
          cd app/build/outputs/apk/release
          sha256sum app-release.apk > app-release.apk.sha256
          sha256sum -c app-release.apk.sha256

      - name: Extract CHANGELOG section
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          VER="${TAG_NAME#v}"
          if [ -f CHANGELOG.md ]; then
            awk -v tag="$TAG_NAME" -v ver="$VER" '
              BEGIN { found = 0 }
              /^## \[/ {
                if (found) { exit }
                if (index($0, "## [" tag "]") == 1 || index($0, "## [" ver "]") == 1) {
                  found = 1
                }
              }
              found { print }
            ' CHANGELOG.md > changelog_section.md
          else
            : > changelog_section.md
          fi
          if [ ! -s changelog_section.md ]; then
            echo "::warning::No CHANGELOG.md section found for ${TAG_NAME} (or ${VER}); falling back to empty body."
            : > changelog_section.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release.apk.sha256
          body_path: changelog_section.md
          generate_release_notes: true

      - name: Clean up keystore
        if: always()
        run: rm -f "$HOME/phantom-release.jks"

  desktop-release:
    needs: release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y

      - name: Build Windows Desktop app-image
        run: .\gradlew.bat :desktop:createDistributable --no-daemon

      - name: Build Inno Setup Installer (setup.exe)
        shell: pwsh
        run: |
          $match = Select-String -Path desktop/build.gradle.kts -Pattern 'val desktopVersion\s*=\s*"([^"]+)"'
          $ver = if ($match) { $match.Matches[0].Groups[1].Value } else { "0.5.0" }
          Write-Host "Building Inno Setup release installer for version $ver"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$ver" "desktop\packaging\windows\PhantomCheckDesktop.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Generate Desktop Installer SHA-256
        shell: pwsh
        run: |
          $installers = Get-ChildItem -Path "desktop/build/compose/binaries/main/inno" -Filter "*-setup.exe" -File
          if (-not $installers -or $installers.Count -eq 0) {
            Write-Error "No *-setup.exe installer found to hash."
            exit 1
          }
          foreach ($f in $installers) {
            $hash = (Get-FileHash -Path $f.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $shaFile = "$($f.FullName).sha256"
            [System.IO.File]::WriteAllText($shaFile, "$hash  $($f.Name)`n", [System.Text.UTF8Encoding]::new($false))
            $recorded = (Get-Content -Path $shaFile -Raw).Trim().Split(" ", [System.StringSplitOptions]::RemoveEmptyEntries)[0]
            if ($recorded -ne $hash) {
              Write-Error "SHA-256 self-check failed for $($f.Name)"
              exit 1
            }
            Write-Host "Verified $($f.Name).sha256: $hash"
          }

      - name: Attach Desktop Installer (setup.exe) to GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            desktop/build/compose/binaries/main/inno/*-setup.exe
            desktop/build/compose/binaries/main/inno/*-setup.exe.sha256
